# Builds the Nintendo DS port with devkitARM and libnds. For now it is a benchmark ROM (platform/nds) that times the core on the ARM9; no game data in it.
name: DS
on:
  push:
    branches: ['nds']
    paths-ignore: ['web/**', 'android/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          (dkp-pacman -Sy --noconfirm --needed nds-dev || true)
          ls $DEVKITPRO/libnds/lib; which ndstool || ls $DEVKITPRO/tools/bin
      - name: Where things are
        continue-on-error: true
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          ls $DEVKITPRO $DEVKITPRO/calico $DEVKITPRO/calico/share $DEVKITPRO/libnds $DEVKITPRO/devkitARM | head -80
          cat $DEVKITPRO/devkitARM/ds_rules 2>/dev/null | head -60
          find $DEVKITPRO -maxdepth 4 \( -name "ds*.specs" -o -name "*.specs" -o -name "ds_rules" -o -name "calico*.h" \) | head -20
          find $DEVKITPRO/examples -maxdepth 3 -name Makefile 2>/dev/null | head -5
      - name: Build
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -C platform/nds
          ls -la platform/nds/*.nds
      - name: Run it in DeSmuME and read the screen
        continue-on-error: true
        run: |
          apt-get update && apt-get install -y --no-install-recommends desmume xvfb xauth imagemagick tesseract-ocr x11-utils
          cd platform/nds
          ls /usr/games
          xvfb-run -a -s "-screen 0 1024x768x24" sh -c '/usr/games/desmume-cli --cpu-mode=0 --advanced-timing=1 --rigorous-timing=1 --disable-sound --disable-limiter pacnjump.nds 2>emu.err & P=$!; sleep 40; ps aux | grep -c "[d]esmume-cli"; import -window root shot.png; kill $P' || true
          ls -la shot.png; tail -15 emu.err; xdpyinfo >/dev/null 2>&1 || echo no-x-here
          convert shot.png -resize 250% -colorspace Gray -negate shot_neg.png
          convert shot.png -resize 250% -colorspace Gray shot_pos.png
          for f in shot_pos.png shot_neg.png; do echo "== $f"; tesseract $f - --psm 6 2>/dev/null | head -30; done
      - uses: actions/upload-artifact@v4
        with: { name: "pacnjump-nds-bench-${{ github.run_number }}", path: platform/nds/pacnjump.nds }
