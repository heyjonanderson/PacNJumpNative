# Builds the Nintendo DS port with devkitARM and libnds. For now it is a benchmark ROM (platform/nds) that times the core on the ARM9; no game data in it.
name: DS
on:
  push:
    branches: ['nds']
    paths-ignore: ['web/**', 'android/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          (dkp-pacman -Sy --noconfirm --needed nds-dev || true)
          ls $DEVKITPRO/libnds/lib; which ndstool || ls $DEVKITPRO/tools/bin
      - name: Build
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          export DEVKITARM=$DEVKITPRO/devkitARM
          make -C platform/nds
          ls -la platform/nds/*.nds
      - uses: actions/upload-artifact@v4
        with: { name: "pacnjump-nds-${{ github.run_number }}", path: platform/nds/pacnjump.nds }
      - name: ROM as text in the log (so a build can be fetched where artifact downloads are blocked; it holds no game data)
        run: |
          echo "ROMB64-BEGIN"; gzip -9 -c platform/nds/pacnjump.nds | base64 -w 120; echo "ROMB64-END" 
