# Wii U port probe (platform/wiiu is not written yet): lists what the devkitPro Wii U toolchain offers and checks that the portable core builds and links under devkitPPC.
name: WiiU
on:
  push:
    branches: ['wiiu']
    paths-ignore: ['web/**', 'android/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          dkp-pacman -Sy --noconfirm || true
          echo "== wiiu and wut packages"; dkp-pacman -Sl 2>/dev/null | grep -iE "wiiu|wut|sdl" || true
          echo "== details"; for p in wiiu-sdl2 wiiu-sdl2_mixer wut wut-tools wiiu-dev; do dkp-pacman -Si $p 2>/dev/null | grep -E "^(Name|Version|Description|Depends On|Installed Size)" || true; echo; done
          dkp-pacman -S --noconfirm --needed wiiu-dev wiiu-sdl2 || true
          echo "== sdl2 files"; ls $DEVKITPRO/portlibs/wiiu/include/SDL2 2>/dev/null | head -5; ls $DEVKITPRO/portlibs/wiiu/lib | head; grep -hE "define SDL_(MAJOR|MINOR|PATCH)_VERSION" $DEVKITPRO/portlibs/wiiu/include/SDL2/SDL_version.h 2>/dev/null || true
          echo "== sdl2 wiiu video and audio symbols"; strings $DEVKITPRO/portlibs/wiiu/lib/libSDL2.a 2>/dev/null | grep -iE "^(WIIU_|GX2|VPAD|KPAD|AX)[A-Za-z_]*" | sort -u | head -80 || true
          echo "== tools"; ls $DEVKITPRO/tools/bin | head -40 || true
      - name: SDL2 for Wii U, what it touches
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          S=$(strings $DEVKITPRO/portlibs/wiiu/lib/libSDL2.a 2>/dev/null)
          echo "== VPAD, KPAD, WPAD and GX2 entry points"; echo "$S" | grep -aE "^(VPAD|KPAD|WPAD|GX2Set(TV|DRC)Buffer|GX2CopySurface|GX2Init|GX2SetTV|GX2SetDRC|GX2WaitForVsync|GX2SwapScanBuffers|OSSetSwap)[A-Za-z0-9_]*$" | sort -u | tr '\n' ' ' || true
          echo; echo "== sensor, accel, gyro, rotate, window mentions"; echo "$S" | grep -aiE "accel|gyro|sensor|VPAD" | sort -u | head -20 || true
          echo "== wuhbtool and friends"; ls $DEVKITPRO/tools/bin | tr '\n' ' ' || true
          echo; echo "== objects in libSDL2.a for wiiu"; $DEVKITPRO/devkitPPC/bin/powerpc-eabi-ar t $DEVKITPRO/portlibs/wiiu/lib/libSDL2.a | grep -i wiiu | tr '\n' ' ' || true
          echo; echo "== VPAD/KPAD/GX2 symbols in the wiiu objects"; $DEVKITPRO/devkitPPC/bin/powerpc-eabi-nm -A $DEVKITPRO/portlibs/wiiu/lib/libSDL2.a 2>/dev/null | grep -E " U (VPAD|KPAD|WPAD|GX2Set(TV|DRC)|GX2CopySurface|GX2CalcTV|GX2CalcDRC|GX2WaitForVsync|GX2SwapScan)[A-Za-z0-9_]*$" | sed 's/.* U //' | sort -u | tr '\n' ' ' || true
          echo; echo "== sdl wiiu source file names"; echo "$S" | grep -E "SDL_wiiu|wiiu.*\.c$" | sort -u | head -30 || true
      - name: Compiler
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}; export PATH=$DEVKITPRO/devkitPPC/bin:$PATH
          powerpc-eabi-gcc -v 2>&1 | tail -3
          powerpc-eabi-gcc -Q --help=target 2>/dev/null | grep -E "mcpu|mhard-float|msoft-float|mfused-madd" | head || true
          powerpc-eabi-gcc -Q --help=common 2>/dev/null | grep -E "ffp-contract" || true
      - name: The core builds here
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}; export PATH=$DEVKITPRO/devkitPPC/bin:$PATH
          for v in "" "-DPNJ_FLOAT"; do
            powerpc-eabi-gcc -std=gnu99 -O2 -ffp-contract=off -mcpu=750 $v -c core/pnj_core.c -o /tmp/core.o && powerpc-eabi-size /tmp/core.o
          done
